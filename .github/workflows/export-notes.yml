name: Export Notes

# Produces an encrypted archive of every lecture summary so a local machine
# can pull it and write the notes into a private Obsidian vault.  GitHub
# Actions runs in the cloud and cannot reach a local vault, so this workflow
# only prepares the data; the vault write happens locally.
#
# The repository is public, so the archive is encrypted with FICS_DUMP_KEY
# before it is uploaded.  Nothing readable ever touches the runner log or the
# artifact store.

on:
  workflow_run:
    workflows: ["iCourse Check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    # workflow_run fires for failed runs too; only export after a clean check.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch database from data branch
        run: |
          mkdir -p data/sharded/shards
          git fetch origin data --depth=1
          git show origin/data:data/icourse-index.enc > data/sharded/icourse-index.enc
          shard_paths=$(git ls-tree -r --name-only origin/data | grep '^data/shards/' || true)
          for path in $shard_paths; do
            base=$(basename "$path")
            git show "origin/data:$path" > "data/sharded/shards/$base"
          done
          echo "Loaded $(ls data/sharded/shards 2>/dev/null | wc -l) shard(s)."

      - name: Reassemble database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          python scripts/db_shard.py reassemble data/sharded data/icourse.db
          ls -la data/icourse.db

      - name: Export summaries (encrypted)
        env:
          DUMP_KEY: ${{ secrets.FICS_DUMP_KEY }}
        run: |
          python - <<'PY'
          import sqlite3
          import subprocess
          import sys

          db = sqlite3.connect("data/icourse.db")
          subs = [str(r[0]) for r in db.execute(
              "SELECT sub_id FROM lectures"
              " WHERE summary IS NOT NULL"
              "   AND TRIM(summary, char(32)||char(9)||char(10)||char(13)) <> ''"
              " ORDER BY course_id, date, sub_id"
          )]
          print(f"Summarized lectures: {len(subs)}")
          subprocess.run(
              [sys.executable, "scripts/dump_lectures.py",
               "data/icourse.db", "dump", *subs],
              check=True,
          )
          PY
          tar czf - dump \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:DUMP_KEY \
            > notes-export.tar.gz.enc
          ls -la notes-export.tar.gz.enc

      - name: Upload encrypted export
        uses: actions/upload-artifact@v4
        with:
          name: notes-export
          path: notes-export.tar.gz.enc
          retention-days: 30
