name: Probe Counters (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch database from data branch
        run: |
          mkdir -p data/sharded/shards
          git fetch origin data --depth=1
          git show origin/data:data/icourse-index.enc > data/sharded/icourse-index.enc
          shard_paths=$(git ls-tree -r --name-only origin/data | grep '^data/shards/' || true)
          for path in $shard_paths; do
            base=$(basename "$path")
            git show "origin/data:$path" > "data/sharded/shards/$base"
          done

      - name: Reassemble database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          python scripts/db_shard.py reassemble data/sharded data/icourse.db

      - name: Dump lecture counters
        run: |
          python - <<'PY'
          import json
          import sqlite3

          db = sqlite3.connect("data/icourse.db")
          db.row_factory = sqlite3.Row
          cols = {r[1] for r in db.execute("PRAGMA table_info(lectures)")}
          print("columns:", sorted(cols))
          print("meta keys:", [
              (r[0], r[1]) for r in db.execute("SELECT key, value FROM meta")
          ])
          rows = [dict(r) for r in db.execute(
              "SELECT sub_id, course_id, date, error_count, silent_count,"
              " error_stage, error_msg, processed_at FROM lectures"
              " WHERE error_stage IS NOT NULL OR processed_at IS NULL"
              " ORDER BY course_id, date"
          )]
          print(json.dumps(rows, ensure_ascii=False, indent=1))
          PY
